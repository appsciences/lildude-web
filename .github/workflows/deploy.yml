name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: backup-2b746.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: backup-2b746
          VITE_FIREBASE_STORAGE_BUCKET: backup-2b746.firebasestorage.app
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_MEDIA_BASE: ${{ vars.VITE_MEDIA_BASE }}
          VITE_STRIPE_DONATE_URL: ${{ vars.VITE_STRIPE_DONATE_URL }}
          VITE_STRIPE_PREORDER_URL: ${{ vars.VITE_STRIPE_PREORDER_URL }}

      # Merge to main -> live site
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: backup-2b746
          channelId: live

      # Same-repo PRs -> temporary preview URL
      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: backup-2b746
